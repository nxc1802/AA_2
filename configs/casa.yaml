seed: 42
strict: true

dataset:
  name: cifar10
  samples: 100
  batch_size: 64

model:
  name: resnet18
  checkpoint: resnet18_cifar10_best.pth

benchmark:
  k_values: [1, 2, 4, 8, 16, 32, 64]

attacks:
  - casa

attacks_kwargs:
  casa:
    steps: 20
    inner_steps: 10
    repair_steps: 4
    alpha: 0.25
    loss_fn: dlr
    drop_and_repair: true
    pair_exploration: true
    pair_search_every: 3
    enable_gct: true
    spatial_nms: true
    adaptive_batch_swap: true
