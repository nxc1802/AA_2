seed: 42
strict: true

dataset:
  name: cifar10
  samples: 100
  batch_size: 64

model:
  name: resnet18
  checkpoint: resnet18_cifar10_best.pth

benchmark:
  k_values: [1, 2, 4, 8, 16, 32, 64]

attacks:
  - casa

attacks_kwargs:
  casa:
    steps: 20
    inner_steps: 10
    repair_steps: 5
    alpha: 0.015686274 # 4/255
    loss_fn: margin
    drop_and_repair: true
