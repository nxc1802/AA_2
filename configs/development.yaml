# development.yaml — Development & intermediate validation benchmark config
# Use for: Intermediate verification, fast ablation runs, hyperparameter tuning
# Dataset: 1,000 class-stratified samples (seed 42)

seed: 42
strict: true

dataset:
  name: cifar10
  samples: 1000
  batch_size: 512

model:
  name: resnet18
  checkpoint: resnet18_cifar10_best.pth
  expected_sha256: 378eb005089d3942a3f237aeb08a927aa3dfbe41535c364891468b33c87d2172
  expected_clean_acc: 94.84

attacks_batch_size:
  fgsm: 512
  bim: 512
  pgd: 512
  cornersearch: 512
  pgd0: 512
  spgd: 512
  sparse_rs: 512
  sparsefool: 512
  sigma_zero: 512
  gse: 512
  casa: 16
  ours: 16

benchmark:
  k_values: [1, 2, 4, 8, 16, 32, 64]

defense_attacks:
  - pgd0
  - sparse_rs
  - casa

defense_k: 16

dense_references:
  - fgsm
  - bim
  - pgd

sparse_budgeted:
  - cornersearch
  - pgd0
  - spgd
  - sparse_rs

minimal_support:
  - sparsefool
  - sigma_zero
  - gse

proposed:
  - casa

attacks:
  - fgsm
  - bim
  - pgd
  - cornersearch
  - pgd0
  - spgd
  - sparse_rs
  - sparsefool
  - sigma_zero
  - gse
  - casa

attacks_kwargs:
  pgd:
    eps: 0.031372549  # 8/255
    alpha: 0.007843137  # 2/255
    steps: 20
    random_start: true

  fgsm:
    eps: 0.031372549  # 8/255

  bim:
    eps: 0.031372549  # 8/255
    alpha: 0.007843137  # 2/255
    steps: 10

  cornersearch:
    max_k: 64

  pgd0:
    steps: 100

  spgd:
    steps: 100
    alpha: 0.25

  sparse_rs:
    n_queries: 10000

  sparsefool:
    max_iter: 20

  sigma_zero:
    steps: 500

  gse:
    max_evals: 1000

  casa:
    steps: 20
    inner_steps: 10
    alpha: 0.25
    repair_steps: 4
    loss_fn: dlr
    drop_and_repair: true
    pair_exploration: true
    pair_search_every: 3
    enable_gct: true
    spatial_nms: true
    adaptive_batch_swap: true

  ours:
    steps: 20
    inner_steps: 10
    alpha: 0.25
    repair_steps: 4
    loss_fn: dlr
    drop_and_repair: true
    pair_exploration: true
    pair_search_every: 3
    enable_gct: true
    spatial_nms: true
    adaptive_batch_swap: true
