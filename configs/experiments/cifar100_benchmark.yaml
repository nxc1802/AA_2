# configs/experiments/cifar100_benchmark.yaml
# CIFAR-100 Benchmark Configuration (100 classes, 32x32)
seed: 42
strict: false

dataset:
  name: cifar100
  samples: 10000  # Full 10,000 test set of CIFAR-100
  batch_size: 512

model:
  name: resnet18
  num_classes: 100
  checkpoint: resnet18_cifar100_best.pth

benchmark:
  k_values: [1, 2, 4, 8, 16, 32, 64]

attacks:
  - casa
  - spgd
  - sigma_zero

attacks_batch_size:
  casa: 16
  spgd: 512
  sigma_zero: 512
