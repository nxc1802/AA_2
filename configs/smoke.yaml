# smoke.yaml — Fast sanity check config (20 samples, minimal steps)
# Use for: CI, quick iteration, debugging
# NOT suitable for paper results.

seed: 42

dataset:
  name: cifar10
  samples: 20
  batch_size: 20

model:
  name: resnet18
  checkpoint: resnet18_cifar10_best.pth

benchmark:
  k_values: [1, 2, 4, 8, 16, 32, 64]

defense_attacks:
  - pgd0
  - sparse_rs
  - casa

defense_k: 16

attacks:
  - fgsm
  - bim
  - pgd
  - cornersearch
  - pgd0
  - spgd
  - sparse_rs
  - sparsefool
  - sigma_zero
  - gse
  - casa

attacks_kwargs:
  pgd:
    eps: 0.031372549  # 8/255
    alpha: 0.007843137  # 2/255
    steps: 20
    random_start: true

  fgsm:
    eps: 0.031372549  # 8/255

  bim:
    eps: 0.031372549  # 8/255
    alpha: 0.007843137  # 2/255
    steps: 10

  cornersearch:
    max_iter: 100
    n_max: 50

  pgd0:
    steps: 20  # reduced for smoke

  spgd:
    steps: 20  # reduced for smoke

  sparse_rs:
    n_queries: 200  # reduced for smoke

  sparsefool:
    max_iter: 10  # reduced for smoke

  sigma_zero:
    steps: 50  # reduced for smoke

  gse:
    max_evals: 100  # reduced for smoke

  casa:
    steps: 5  # reduced for smoke
    inner_steps: 2
    candidate_pool_size: 4
    alpha: 0.25
    repair_steps: 2
    loss_fn: dlr
    drop_and_repair: true
    pair_exploration: true
    pair_search_every: 2
    enable_gct: true
    spatial_nms: true
    adaptive_batch_swap: true

  ours:
    steps: 5  # reduced for smoke
    inner_steps: 2
    candidate_pool_size: 4
    alpha: 0.25
    repair_steps: 2
    loss_fn: dlr
    drop_and_repair: true
    pair_exploration: true
    pair_search_every: 2
    enable_gct: true
    spatial_nms: true
    adaptive_batch_swap: true

  ours_v1:
    steps: 5  # reduced for smoke
    alpha: 0.015686274  # 4/255
    feature_weight: 1.0
    feature_guidance: true
    interaction: true
    interaction_mode: cpa
    pruning: true
    pruning_max_passes: 2  # reduced for smoke

