experiment:
  name: cifar10_vit_cifar_clean
  seed: 42

dataset:
  name: cifar10
  num_workers: 4

model:
  name: vit_cifar
  num_classes: 10

training:
  epochs: 10
  train_batch_size: 256
  eval_batch_size: 512
  amp: true
  grad_accum_steps: 1

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  name: cosine
  min_lr: 0.0

checkpoint:
  directory: result/checkpoints
  monitor: val_accuracy
  mode: max
  save_last: true
  save_best: true
