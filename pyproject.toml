[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa"
version = "0.1.0"
description = "Minimal, reproducible sparse adversarial attack research package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "tqdm>=4.64.0",
    "Pillow>=9.0.0",
    "scikit-image>=0.19.0",
    "pandas>=1.5.0",
    "datasets>=2.10.0",
    "huggingface_hub>=0.16.0",
    "scikit-learn>=1.0.0",
    "lpips>=0.1.4",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
